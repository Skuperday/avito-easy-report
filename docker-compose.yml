services:
  postgres:
    image: postgres:17-alpine
    container_name: avito-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: avito
      POSTGRES_PASSWORD: ${DB_PASSWORD:-avito}
      POSTGRES_DB: avito
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avito"]
      interval: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avito-backend
    restart: unless-stopped
    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: avito
      DB_PASSWORD: ${DB_PASSWORD:-avito}
      DB_NAME: avito
      JWT_SECRET: ${JWT_SECRET:-avito-secret-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: avito-frontend
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:alpine
    container_name: avito-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data

volumes:
  pgdata:
  caddy_data:
